<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaxis ProMax Modeller</title>
<link rel="stylesheet" href="common.css">
<style>
  .body { grid-template-columns: 272px 1fr 312px; }
  .center { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
  .soilcol { display: flex; gap: 14px; padding: 4px 0; }
  .soilcol .col { width: 46px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
  .soilcol .col div { border-bottom: 1px solid rgba(0,0,0,.18); }
  .soilcol .cap { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 4px; }
  .layers-wrap { display: grid; grid-template-columns: auto 1fr; gap: 16px; }
  .mat-wrap { display: grid; grid-template-columns: 230px 1fr; gap: 0; min-height: 420px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mat-list { border-right: 1px solid var(--border); background: var(--surface); overflow: auto; max-height: 60vh; }
  .mat-list .grp { padding: 8px 10px 3px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; }
  .mat-list .grp button { margin-left: auto; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 11.5px; text-transform: none; letter-spacing: 0; }
  .mat-list .it { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: default; }
  .mat-list .it:hover { background: var(--hover); }
  .mat-list .it.sel { background: var(--accent); color: var(--on-accent); }
  .mat-list .it .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.2); }
  .mat-form { overflow: auto; max-height: 60vh; }
  .mat-form .tabs button { flex: none; padding: 0 14px; }
  .mat-form .props .row { grid-template-columns: 52% 48%; }
  .steps { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 12px; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border: 1px solid var(--border-subtle); border-radius: 7px; }
  .step .st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; border: 1.5px solid var(--input-border); color: var(--muted); }
  .step.done .st { background: var(--ok); border-color: var(--ok); color: #fff; }
  .step.running .st { border-color: var(--accent); border-top-color: transparent; animation: spin 1s linear infinite; }
  .step.failed .st { background: var(--danger); border-color: var(--danger); color: #fff; }
  .step .d { color: var(--muted); font-size: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .runlog { max-height: 160px; overflow: auto; background: var(--surface); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
  .note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: flex; gap: 10px; }
  .note svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .phase-tools { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); }
  .split { display: grid; grid-template-rows: minmax(120px, 40%) 1fr; min-height: 0; }
  .split > div { display: flex; flex-direction: column; min-height: 0; }
  .welcome { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .welcome .card { pointer-events: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 26px 30px; width: 520px; }
  .welcome h2 { margin: 0 0 6px; font-size: 18px; }
  .welcome p { color: var(--muted); margin: 0 0 16px; }
  .welcome .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .welcome .opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
  .welcome .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .welcome .opt svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .welcome .opt b { display: block; margin-bottom: 2px; }
  .welcome .opt span { color: var(--muted); font-size: 12px; }
  .lvl { display: flex; align-items: center; gap: 6px; }
  .lvl input { width: 70px; height: 24px; border: 1px solid var(--border); border-radius: 5px; background: var(--field); padding: 0 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="logo" id="logo"></div><span class="app-name">Plaxis ProMax Modeller</span><span class="doc" id="docname"></span>
    <span class="spacer"></span>
    <span class="badge" id="licbadge" title="Building and editing a model uses no Plaxis licence. Only Calculate in Plaxis does, and gives it back when it ends."><span class="dot"></span>No Plaxis licence in use</span>
  </div>
  <div class="menubar" id="menubar"></div>
  <div class="ribbon" id="ribbon"></div>
  <div class="body">
    <div class="panel left" id="left"></div>
    <div class="center">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="hud" id="hud"></div>
        <div class="viewbtns" id="viewbtns"></div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="messages" id="messages" hidden></div>
    </div>
    <div class="panel right" id="right"></div>
  </div>
  <div class="statusbar" id="status"></div>
</div>
<script src="common.js"></script>
<script>
"use strict";
const { $, el, icon, fmt, clamp } = PP;
const API = location.protocol.startsWith("http") && !/offline/.test(location.search) ? "api/" : null;

// ---- State ---------------------------------------------------------------------------------------------------------
let model = null, filePath = null, rev = 0, dirty = false, samples = {};
const ui = { mode: "soil", tool: "select", sel: null, phase: null, view: "3d", snap: true, grid: true, labels: true, level: 0,
  draft: [], cursor: null, mesh: null, messages: [], plaxis: null, run: null, leftTab: "model" };
const undoStack = [], redoStack = [];
const KIND_NAMES = { plate: "Plate", anchor: "Node-to-node anchor", fixedanchor: "Fixed-end anchor", geogrid: "Geogrid", embedded: "Embedded beam", interface: "Interface",
  polygon: "Soil polygon", lineload: "Line load", pointload: "Point load", surfaceload: "Surface load", linedisp: "Line displacement" };
const MAT_KINDS = { soil: "Soil and interfaces", plate: "Plates", anchor: "Anchors", geogrid: "Geogrids", embedded: "Embedded beams" };
const MAT_FOR = { plate: "plate", anchor: "anchor", fixedanchor: "anchor", geogrid: "geogrid", embedded: "embedded", polygon: "soil" };
const CALCS = ["K0 procedure", "Gravity loading", "Plastic", "Consolidation", "Safety", "Fully coupled"];
const COARSE = ["Very coarse", "Coarse", "Medium", "Fine", "Very fine"];
const MESH_F = { "Very coarse": 0.12, "Coarse": 0.08, "Medium": 0.06, "Fine": 0.04, "Very fine": 0.03 };
const SOIL_COLOURS = ["#E8C872", "#C9A66B", "#8FA9B8", "#D9A441", "#A3B86C", "#B98E6E", "#9DB4C9", "#C7B28A", "#7FA88B", "#D6B4A0"];
const STRUCT_COLOURS = { plate: "#2F5597", anchor: "#7C3AED", fixedanchor: "#7C3AED", geogrid: "#B7791F", embedded: "#0F766E", interface: "#64748B", lineload: "#DC2626", pointload: "#DC2626", surfaceload: "#DC2626", linedisp: "#0EA5E9", polygon: "#475569" };
const is3D = () => model && model.product === "3D";
let uidN = 1;
function uid(prefix) { const ids = new Set(allIds()); let id; do { id = prefix + (uidN++); } while (ids.has(id)); return id; }
function allIds() { return [...(model.materials || []), ...(model.boreholes || []), ...(model.structures || []), ...(model.waterlevels || []), ...(model.phases || [])].map((o) => o.id); }
const mat = (id) => (model.materials || []).find((m) => m.id === id);
const struct = (id) => (model.structures || []).find((s) => s.id === id);
const phaseOf = (id) => (model.phases || []).find((p) => p.id === id);
const nameNext = (base, list) => { let i = 1; const names = new Set(list.map((o) => o.name)); while (names.has(base + " " + i)) i++; return base + " " + i; };

function blank(product) {
  const d3 = product === "3D";
  return { format: "ppm", version: 1, title: "New project", product: d3 ? "3D" : "2D", model: "plane strain", elements: 15,
    units: { length: "m", force: "kN", time: "day" },
    contour: d3 ? { xmin: 0, xmax: 50, ymin: 0, ymax: 50, zmin: -25 } : { xmin: 0, xmax: 50, ymin: -25, ymax: 0 },
    materials: [], boreholes: [], structures: [], waterlevels: [], mesh: { coarseness: "Medium", refine: [] },
    phases: [{ id: "p0", name: "Initial phase", calc: "K0 procedure", parent: null, active: {} }] };
}

// ---- Server --------------------------------------------------------------------------------------------------------
async function api(path, opts) {
  if (!API) throw new Error("The Modeller is open as a page only: this needs Plaxis ProMax running.");
  const r = await fetch(API + path, opts);
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch (e) { j = { error: t }; }
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
let pushTimer = 0, pushing = false;
function schedulePush() {
  if (!API) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    pushing = true;
    try { const j = await api("model", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ rev, model }) }); rev = j.rev; }
    catch (e) { say("warning", "The change did not reach Plaxis ProMax: " + e.message); }
    pushing = false;
  }, 350);
}
async function poll() {
  if (!API) return;
  try {
    const j = await api("model?rev=" + rev);
    if (j.model && j.rev !== rev && !pushing) {
      rev = j.rev; filePath = j.path || filePath;
      if (JSON.stringify(j.model) !== JSON.stringify(model)) { pushUndo(); model = j.model; normalise(); ui.mesh = null; renderAll(); toast("The model was changed from the chat."); }
    }
    if (j.dirty != null) { dirty = j.dirty; title(); }
  } catch (e) { }
  setTimeout(poll, 1500);
}

// ---- Change, undo --------------------------------------------------------------------------------------------------
function pushUndo() { undoStack.push(JSON.stringify(model)); if (undoStack.length > 200) undoStack.shift(); redoStack.length = 0; }
function change(fn) { pushUndo(); fn(); dirty = true; ui.mesh = null; normalise(); renderAll(); schedulePush(); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(model)); model = JSON.parse(undoStack.pop()); after(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(model)); model = JSON.parse(redoStack.pop()); after(); }
function after() { dirty = true; ui.mesh = null; normalise(); if (ui.sel && !findAny(ui.sel)) ui.sel = null; renderAll(); schedulePush(); }
function normalise() {
  for (const k of ["materials", "boreholes", "structures", "waterlevels", "phases"]) model[k] = model[k] || [];
  model.mesh = model.mesh || { coarseness: "Medium", refine: [] };
  if (!model.phases.length) model.phases.push({ id: "p0", name: "Initial phase", calc: "K0 procedure", parent: null, active: {} });
  for (const p of model.phases) p.active = p.active || {};
  if (!phaseOf(ui.phase)) ui.phase = model.phases[0].id;
  model.materials.forEach((m, i) => { if (!m.colour) m.colour = m.kind === "soil" ? SOIL_COLOURS[i % SOIL_COLOURS.length] : "#5B6B7F"; });
}
function findAny(id) { return mat(id) || struct(id) || model.boreholes.find((b) => b.id === id) || model.waterlevels.find((w) => w.id === id) || phaseOf(id) || (id === "project" ? model : null); }

// ---- Derived geometry ----------------------------------------------------------------------------------------------
function holesSorted() { return [...model.boreholes].sort((a, b) => a.x - b.x); }
function layerCount() { return Math.max(0, ...model.boreholes.map((b) => (b.layers || []).length)); }
function levelsOf(b) { const out = [b.top ?? 0]; for (const l of b.layers || []) out.push(l.bottom); return out; }
/** The level of boundary i (0 = ground) at x, linear between boreholes, flat beyond them. */
function boundaryAt(i, x) {
  const hs = holesSorted(); if (!hs.length) return null;
  const lv = (b) => { const l = levelsOf(b); return l[Math.min(i, l.length - 1)]; };
  if (x <= hs[0].x) return lv(hs[0]);
  if (x >= hs[hs.length - 1].x) return lv(hs[hs.length - 1]);
  for (let k = 0; k < hs.length - 1; k++) if (x >= hs[k].x && x <= hs[k + 1].x) { const t = (x - hs[k].x) / ((hs[k + 1].x - hs[k].x) || 1); return lv(hs[k]) + (lv(hs[k + 1]) - lv(hs[k])) * t; }
  return lv(hs[0]);
}
function headAt(x) {
  const hs = holesSorted().filter((b) => b.head != null); if (!hs.length) return null;
  if (x <= hs[0].x) return hs[0].head; if (x >= hs[hs.length - 1].x) return hs[hs.length - 1].head;
  for (let k = 0; k < hs.length - 1; k++) if (x >= hs[k].x && x <= hs[k + 1].x) { const t = (x - hs[k].x) / ((hs[k + 1].x - hs[k].x) || 1); return hs[k].head + (hs[k + 1].head - hs[k].head) * t; }
}
function layerPolygons() {
  const c = model.contour, xs = [c.xmin, ...holesSorted().map((b) => b.x).filter((x) => x > c.xmin && x < c.xmax), c.xmax];
  const n = layerCount(), out = [], first = holesSorted()[0];
  for (let i = 0; i < n; i++) {
    const top = xs.map((x) => [x, boundaryAt(i, x)]), bot = xs.map((x) => [x, boundaryAt(i + 1, x)]).reverse();
    const ml = first && first.layers[i] ? first.layers[i].material : null;
    out.push({ id: "layer" + i, index: i, poly: [...top, ...bot], material: ml });
  }
  return out;
}
function modelBounds() {
  const c = model.contour;
  if (is3D()) return [[c.xmin, c.ymin, c.zmin ?? bottomLevel()], [c.xmax, c.ymax, topLevel()]];
  return [c.xmin, Math.min(c.ymin ?? -20, bottomLevel()), c.xmax, Math.max(c.ymax ?? 0, topLevel())];
}
function topLevel() { const hs = model.boreholes; return hs.length ? Math.max(...hs.map((b) => b.top ?? 0)) : (is3D() ? 0 : model.contour.ymax ?? 0); }
function bottomLevel() { const hs = model.boreholes; const bots = hs.map((b) => { const l = levelsOf(b); return l[l.length - 1]; }); return bots.length ? Math.min(...bots) : (is3D() ? model.contour.zmin ?? -20 : model.contour.ymin ?? -20); }

/** Active state of an object in a phase, following the chain of parent phases (Plaxis keeps state per phase). */
function activeIn(id, phaseId) {
  let p = phaseOf(phaseId); const seen = new Set();
  while (p && !seen.has(p.id)) {
    seen.add(p.id);
    if (p.active && id in p.active) return p.active[id];
    p = phaseOf(p.parent) || (model.phases.indexOf(p) > 0 && !p.parent ? model.phases[model.phases.indexOf(p) - 1] : null);
  }
  const s = struct(id);
  if (s && s.type === "polygon") return true;
  if (String(id).startsWith("layer")) return true;
  return false;
}
function waterIn(phaseId) {
  let p = phaseOf(phaseId); const seen = new Set();
  while (p && !seen.has(p.id)) { seen.add(p.id); if (p.water) return p.water; p = phaseOf(p.parent); }
  return null;
}
function loadIn(id, phaseId) {
  let p = phaseOf(phaseId); const seen = new Set();
  while (p && !seen.has(p.id)) { seen.add(p.id); if (p.loads && p.loads[id]) return p.loads[id]; p = phaseOf(p.parent); }
  return null;
}

// ---- Canvas ---------------------------------------------------------------------------------------------------------
const cv = $("#cv");
const v2 = new PP.View2D(cv, () => draw());
const v3 = new PP.Orbit3D(cv, () => draw());
let fitted = false;
function using3D() { return is3D() && ui.view === "3d"; }
function fit() {
  if (!model) return;
  if (is3D()) {
    const [mn, mx] = modelBounds();
    if (ui.view === "3d") v3.fit(mn, mx); else { v2.fit(mn[0], mn[1], mx[0], mx[1]); }
  } else { const b = modelBounds(); v2.fit(b[0], b[1], b[2], b[3]); }
  fitted = true; draw();
}
new ResizeObserver(() => draw()).observe($("#stage"));

function draw() {
  if (!model) return;
  if (using3D()) return draw3D();
  v2.size();
  const ctx = v2.ctx;
  ctx.fillStyle = PP.css("--canvas"); ctx.fillRect(0, 0, v2.w, v2.h);
  if (!fitted) { fit(); return; }
  v2.upLabel = is3D() ? "y" : "y";
  if (ui.grid) v2.grid(PP.css("--canvas-grid"), PP.css("--canvas-grid-major"), PP.css("--canvas-text"));
  if (is3D()) drawPlan(ctx); else draw2D(ctx);
  drawDraft(ctx);
  v2.axes(PP.css("--canvas-text"));
}

function polyPath(ctx, poly, X = (p) => v2.X(p[0]), Y = (p) => v2.Y(p[1])) {
  ctx.beginPath(); poly.forEach((p, i) => i ? ctx.lineTo(X(p), Y(p)) : ctx.moveTo(X(p), Y(p))); ctx.closePath();
}
function hatch(ctx, colour) {
  const p = document.createElement("canvas"); p.width = p.height = 8;
  const g = p.getContext("2d"); g.strokeStyle = colour; g.lineWidth = 1; g.beginPath(); g.moveTo(0, 8); g.lineTo(8, 0); g.stroke();
  return ctx.createPattern(p, "repeat");
}

function draw2D(ctx) {
  const c = model.contour, mode = ui.mode, stages = mode === "stages";
  const dim = mode === "structures" || mode === "mesh" || mode === "flow";
  const canvasBg = PP.css("--canvas");
  // Contour
  const b = modelBounds();
  ctx.fillStyle = PP.isDark() ? "#2a2f36" : "#ffffff";
  ctx.fillRect(v2.X(c.xmin), v2.Y(b[3]), (c.xmax - c.xmin) * v2.s, (b[3] - b[1]) * v2.s);
  // Soil layers
  for (const L of layerPolygons()) {
    const m = mat(L.material);
    const on = !stages || activeIn(L.id, ui.phase);
    let fill = m ? m.colour : "#cbd5e1";
    if (dim) fill = PP.mix(fill, PP.isDark() ? "#2b2f36" : "#ffffff", 0.55);
    polyPath(ctx, L.poly);
    ctx.fillStyle = on ? fill : canvasBg; ctx.fill();
    ctx.strokeStyle = PP.isDark() ? "rgba(255,255,255,.35)" : "rgba(15,23,42,.45)"; ctx.lineWidth = 1; ctx.stroke();
    if (ui.sel === L.id) { ctx.strokeStyle = PP.css("--sel"); ctx.lineWidth = 3; ctx.stroke(); }
  }
  // Soil polygons (structures mode and later)
  if (mode !== "soil") for (const s of model.structures.filter((s) => s.type === "polygon")) {
    const on = !stages || activeIn(s.id, ui.phase);
    polyPath(ctx, s.points);
    if (stages && !on) { ctx.fillStyle = canvasBg; ctx.fill(); ctx.fillStyle = hatch(ctx, PP.isDark() ? "rgba(255,255,255,.12)" : "rgba(15,23,42,.10)"); ctx.fill(); }
    else if (s.material && mat(s.material)) { ctx.fillStyle = dim ? PP.mix(mat(s.material).colour, "#ffffff", .5) : mat(s.material).colour; ctx.fill(); }
    else if (!stages) { ctx.fillStyle = "rgba(71,85,105,.07)"; ctx.fill(); }
    ctx.setLineDash(stages ? [] : [6, 4]); ctx.strokeStyle = PP.isDark() ? "#cbd5e1" : "#334155"; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
    if (ui.sel === s.id) { ctx.strokeStyle = PP.css("--sel"); ctx.lineWidth = 3; ctx.stroke(); }
  }
  // Mesh preview
  if (mode === "mesh" && ui.mesh) {
    const m = ui.mesh; ctx.strokeStyle = PP.isDark() ? "rgba(236,239,243,.42)" : "rgba(15,23,42,.38)"; ctx.lineWidth = 0.7; ctx.beginPath();
    for (let i = 0; i < m.tri.length; i += 3) { const a = m.tri[i], bb = m.tri[i + 1], cc = m.tri[i + 2]; ctx.moveTo(v2.X(m.x[a]), v2.Y(m.y[a])); ctx.lineTo(v2.X(m.x[bb]), v2.Y(m.y[bb])); ctx.lineTo(v2.X(m.x[cc]), v2.Y(m.y[cc])); ctx.closePath(); }
    ctx.stroke();
  }
  // Contour outline
  ctx.strokeStyle = PP.isDark() ? "#e2e8f0" : "#0f172a"; ctx.lineWidth = 1.6;
  ctx.strokeRect(v2.X(c.xmin), v2.Y(b[3]), (c.xmax - c.xmin) * v2.s, (b[3] - b[1]) * v2.s);
  // Water
  drawWater2D(ctx);
  // Boreholes
  for (const h of model.boreholes) {
    const X = v2.X(h.x), lv = levelsOf(h), top = v2.Y(lv[0]), bot = v2.Y(lv[lv.length - 1]);
    const show = mode === "soil" || mode === "flow";
    ctx.strokeStyle = ui.sel === h.id ? PP.css("--sel") : (PP.isDark() ? "#f1f5f9" : "#0f172a"); ctx.lineWidth = ui.sel === h.id ? 3 : show ? 1.8 : 1;
    ctx.globalAlpha = show ? 1 : 0.45;
    ctx.beginPath(); ctx.moveTo(X, top - 10); ctx.lineTo(X, bot); ctx.stroke();
    for (const y of lv) { ctx.beginPath(); ctx.moveTo(X - 4, v2.Y(y)); ctx.lineTo(X + 4, v2.Y(y)); ctx.stroke(); }
    if (ui.labels) { label(ctx, h.name, X, top - 14, "center"); }
    if (h.head != null && show) { const Y = v2.Y(h.head); ctx.fillStyle = PP.css("--water"); ctx.beginPath(); ctx.moveTo(X - 6, Y - 9); ctx.lineTo(X + 6, Y - 9); ctx.lineTo(X, Y - 1); ctx.closePath(); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // Structures
  const showStruct = mode !== "soil";
  if (showStruct) for (const s of model.structures) if (s.type !== "polygon") drawStruct2D(ctx, s, stages ? activeIn(s.id, ui.phase) : true);
  if (mode === "soil" && model.structures.some((s) => s.type !== "polygon")) { ctx.globalAlpha = 0.25; for (const s of model.structures) if (s.type !== "polygon") drawStruct2D(ctx, s, true); ctx.globalAlpha = 1; }
}

function label(ctx, text, x, y, align = "left", color) {
  ctx.font = "600 11px Segoe UI, system-ui, sans-serif"; ctx.textAlign = align; ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width, bx = align === "center" ? x - w / 2 - 5 : align === "right" ? x - w - 10 : x;
  ctx.fillStyle = PP.isDark() ? "rgba(32,36,42,.86)" : "rgba(255,255,255,.88)";
  ctx.beginPath(); ctx.roundRect(bx, y - 9, w + 10, 18, 5); ctx.fill();
  ctx.fillStyle = color || (PP.isDark() ? "#e2e8f0" : "#0f172a");
  ctx.fillText(text, align === "center" ? x : align === "right" ? x - 5 : x + 5, y);
