<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaxis ProMax Viewer</title>
<link rel="stylesheet" href="common.css">
<style>
  .body { grid-template-columns: 262px 1fr 268px; }
  .phase-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center; padding: 5px 10px; cursor: default; border-left: 3px solid transparent; }
  .phase-row:hover { background: var(--hover); }
  .phase-row.sel { background: var(--accent-soft); border-left-color: var(--accent); }
  .phase-row .ok { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; color: #fff; background: var(--ok); }
  .phase-row .ok.bad { background: var(--danger); }
  .phase-row .ok.none { background: var(--surface-2); color: var(--muted); }
  .phase-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phase-row .ct { color: var(--muted); font-size: 11px; }
  .rt { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 22px; cursor: default; }
  .rt:hover { background: var(--hover); }
  .rt.sel { background: var(--accent); color: var(--on-accent); }
  .rt.off { opacity: .45; }
  .rt svg { width: 15px; height: 15px; flex: none; }
  .rgrp { padding: 8px 12px 3px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 4px 12px; font-size: 12.5px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { font-variant-numeric: tabular-nums; text-align: right; }
  .scale { display: flex; flex-direction: column; gap: 3px; padding: 0 6px; justify-content: center; min-width: 180px; }
  .scale .t { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .phase-pick { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 6px; }
  .phase-pick .r { display: flex; gap: 4px; align-items: center; }
  .phase-pick select { height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); padding: 0 6px; max-width: 250px; }
  .phase-pick .btn { height: 28px; padding: 0 6px; }
  .tablewrap { max-height: 62vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  .samplebar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: color-mix(in srgb, var(--warn) 16%, var(--bg)); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 8px; padding: 5px 12px; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="logo" id="logo"></div><span class="app-name">Plaxis ProMax Viewer</span><span class="doc" id="docname"></span>
    <span class="spacer"></span>
    <span class="badge" title="Results were copied from Plaxis when it calculated. Viewing them needs no Plaxis and no licence."><span class="dot"></span>No Plaxis needed</span>
  </div>
  <div class="menubar" id="menubar"></div>
  <div class="ribbon" id="ribbon"></div>
  <div class="body">
    <div class="panel left" id="left"></div>
    <div class="stage" id="stage"><canvas id="cv"></canvas><div class="hud" id="hud"></div><div class="viewbtns" id="viewbtns"></div><div class="hint" id="hint"></div></div>
    <div class="panel right" id="right"></div>
  </div>
  <div class="statusbar" id="status"></div>
</div>
<script src="common.js"></script>
<script>
"use strict";
const SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;
const { $, el, icon, fmt, clamp } = PP;

// ---- Result types -------------------------------------------------------------------------------------------------
// Each has where it lives (node or stress point), a label as Plaxis words it, a unit, and the group it is listed under.
const TYPES = [
  { key: "deformed", group: "Deformations", label: "Deformed mesh", icon: "deformed", at: "mesh" },
  { key: "Utot", group: "Deformations", label: "Total displacements |u|", unit: "m", at: "node", icon: "shading" },
  { key: "Ux", group: "Deformations", label: "Horizontal displacements ux", unit: "m", at: "node", icon: "shading" },
  { key: "Uy", group: "Deformations", label: "Vertical displacements uy", unit: "m", at: "node", icon: "shading", d2: true },
  { key: "Uz", group: "Deformations", label: "Vertical displacements uz", unit: "m", at: "node", icon: "shading", d3: true },
  { key: "SigxxE", group: "Stresses", label: "Effective stress σ'xx", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "SigyyE", group: "Stresses", label: "Effective stress σ'yy", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "SigzzE", group: "Stresses", label: "Effective stress σ'zz", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "Sigxy", group: "Stresses", label: "Shear stress σxy", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "Sig1", group: "Stresses", label: "Principal stress σ'1", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "Sig3", group: "Stresses", label: "Principal stress σ'3", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "principal", group: "Stresses", label: "Principal directions", at: "sp-dir", icon: "cross" },
  { key: "TauRel", group: "Stresses", label: "Relative shear stress τrel", unit: "", at: "sp", icon: "shading" },
  { key: "Plastic", group: "Stresses", label: "Plastic points", at: "sp-plastic", icon: "plastic" },
  { key: "PActive", group: "Pore pressures", label: "Active pore pressure p active", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "PExcess", group: "Pore pressures", label: "Excess pore pressure p excess", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "PSteady", group: "Pore pressures", label: "Steady-state pore pressure", unit: "kN/m²", at: "sp", icon: "shading" },
  { key: "GroundwaterHead", group: "Pore pressures", label: "Groundwater head", unit: "m", at: "node", icon: "shading" },
  { key: "plate:M", group: "Structures", label: "Plates: bending moment M", unit: "kN m/m", at: "plate", field: "M", icon: "chart" },
  { key: "plate:Q", group: "Structures", label: "Plates: shear force Q", unit: "kN/m", at: "plate", field: "Q", icon: "chart" },
  { key: "plate:N", group: "Structures", label: "Plates: axial force N", unit: "kN/m", at: "plate", field: "N", icon: "chart" },
  { key: "plate:Ux", group: "Structures", label: "Plates: displacement ux", unit: "m", at: "plate", field: "Ux", icon: "chart" },
  { key: "anchors", group: "Structures", label: "Anchor forces", unit: "kN", at: "anchor", icon: "anchor" },
];
const typeOf = (k) => TYPES.find((t) => t.key === k);

// ---- State --------------------------------------------------------------------------------------------------------
let pack = null, fileName = "";
const ui = { phase: 0, type: "Utot", shading: true, contours: false, arrows: false, meshLines: false, onDeformed: false, scale: 1, autoScale: 1, labels: true,
  tool: null, sectionPts: [], section: null, curve: null, probe: null, view3d: "3d", plane: { axis: "y", at: 27 } };
const cache = new Map();
const is3D = () => pack && pack.product === "3D";
const phase = () => pack.phases[ui.phase];
const usable = (p) => !!(p && p.nodes && p.nodes.x && p.nodes.x.length);

// ---- Loading ------------------------------------------------------------------------------------------------------
async function loadBuffer(buf, name) {
  let p;
  try { p = await PP.readPack(buf); } catch (e) { PP.toast("This is not a Plaxis ProMax results file (.ppr)."); return; }
  if (p.format !== "ppr") { PP.toast("This is not a Plaxis ProMax results file (.ppr)."); return; }
  pack = p; fileName = name || ""; cache.clear();
  ui.phase = Math.max(0, pack.phases.map(usable).lastIndexOf(true));
  const last = pack.phases[ui.phase];
  if (last && last.calc === "Safety" && ui.phase > 0) ui.phase--;
  ui.type = "Utot"; ui.section = null; ui.curve = null; ui.tool = null; $("#drop") && $("#drop").remove();
  if (is3D()) { const c = pack.model.contour; ui.plane = { axis: "y", at: +(((c.ymin + c.ymax) / 2).toFixed(1)) }; }
  fitted = false; renderAll();
}
async function openFile() { const f = await PP.pickFile(".ppr"); if (f) loadBuffer(await f.arrayBuffer(), f.name); }

// ---- Model helpers (from the pack's model) ----------------------------------------------------------------------
function modelPhase(p) { return (pack.model.phases || []).find((q) => q.name === p.name); }
function activeIn(id, phId) {
  const phases = pack.model.phases || [], byId = (i) => phases.find((q) => q.id === i);
  let p = byId(phId); const seen = new Set();
  while (p && !seen.has(p.id)) { seen.add(p.id); if (p.active && id in p.active) return p.active[id]; p = byId(p.parent); }
  const s = (pack.model.structures || []).find((q) => q.id === id);
  return !!(s && s.type === "polygon");
}
function ground(x) {
  const hs = [...(pack.model.boreholes || [])].sort((a, b) => a.x - b.x);
  if (!hs.length) return Infinity;
  if (x <= hs[0].x) return hs[0].top ?? 0; if (x >= hs[hs.length - 1].x) return hs[hs.length - 1].top ?? 0;
  for (let k = 0; k < hs.length - 1; k++) if (x >= hs[k].x && x <= hs[k + 1].x) { const t = (x - hs[k].x) / ((hs[k + 1].x - hs[k].x) || 1); return (hs[k].top ?? 0) + ((hs[k + 1].top ?? 0) - (hs[k].top ?? 0)) * t; }
}
function gone(p) {
  const mp = modelPhase(p); if (!mp) return [];
  return (pack.model.structures || []).filter((s) => s.type === "polygon" && !s.material && !activeIn(s.id, mp.id));
}
function keepFn(p) {
  const c = pack.model.contour, holes = gone(p);
  return (x, y) => x >= c.xmin - 1e-6 && x <= c.xmax + 1e-6 && y <= ground(x) + 1e-6 && !holes.some((h) => PP.inside(h.points, x, y));
}
/** Display mesh over the nodes (or stress points) of a phase: drawn only, Plaxis's own elements are not in the file. */
function meshFor(p, at) {
  const key = ui.phase + ":" + at + (at === "plane" ? ui.plane.axis + ui.plane.at : "");
  if (cache.has(key)) return cache.get(key);
  let xs, ys, idx = null;
  if (at === "plane") ({ xs, ys, idx } = planePoints(p));
  else { const src = at === "sp" ? p.sp : p.nodes; xs = src.x; ys = src.y; }
  const m = PP.displayMesh(xs, ys, at === "plane" ? null : keepFn(p));
  const out = { xs, ys, idx, tri: m.tri, typical: m.typical, index: null };
  cache.set(key, out);
  return out;
}
function planePoints(p) {
  const ax = ui.plane.axis, at = ui.plane.at, X = p.nodes.x, Y = p.nodes.y, Z = p.nodes.z, xs = [], ys = [], idx = [];
  const all = ax === "x" ? X : ax === "y" ? Y : Z;
  let tol = Infinity; for (const v of all) { const d = Math.abs(v - at); if (d > 1e-9) tol = Math.min(tol, d); }
  let best = Infinity; for (const v of all) best = Math.min(best, Math.abs(v - at));
  const take = best + 1e-6 + (isFinite(tol) ? 0 : 0);
  for (let i = 0; i < all.length; i++) if (Math.abs(all[i] - at) <= take) { idx.push(i); if (ax === "x") { xs.push(Y[i]); ys.push(Z[i]); } else if (ax === "y") { xs.push(X[i]); ys.push(Z[i]); } else { xs.push(X[i]); ys.push(Y[i]); } }
  return { xs, ys, idx };
}
function values(p, t) {
  if (!t || !t.at) return null;
  if (t.at === "node") return p.node && p.node[t.key];
  if (t.at === "sp") return p.sp && p.sp[t.key];
  return null;
}
function available(p, t) {
  if (!p) return false;
  if (t.d2 && is3D()) return false; if (t.d3 && !is3D()) return false;
  if (t.at === "mesh") return true;
  if (t.at === "node" || t.at === "sp") return !!values(p, t);
  if (t.at === "sp-dir") return !!(p.sp && p.sp.SigxxE && p.sp.SigyyE && p.sp.Sigxy);
  if (t.at === "sp-plastic") return !!(p.sp && p.sp.Plastic);
  if (t.at === "plate") return (p.plates || []).some((q) => q[t.field]);
  if (t.at === "anchor") return (p.anchors || []).length > 0;
  return false;
}
function extremes(vals) { let mn = Infinity, mx = -Infinity, imn = -1, imx = -1; for (let i = 0; i < vals.length; i++) { const v = vals[i]; if (v == null) continue; if (v < mn) { mn = v; imn = i; } if (v > mx) { mx = v; imx = i; } } return { mn, mx, imn, imx }; }
function maxDisp(p) { const u = p.node && p.node.Utot; if (!u) return 0; let m = 0; for (const v of u) if (v > m) m = v; return m; }
function autoScale(p) {
  const c = pack.model.contour, size = is3D() ? Math.max(c.xmax - c.xmin, c.ymax - c.ymin) : Math.max(c.xmax - c.xmin, (c.ymax ?? 0) - (c.ymin ?? -20));
  const m = Math.max(...pack.phases.filter(usable).map(maxDisp), 1e-9);
  return size * 0.05 / m;
}

// ---- Drawing ------------------------------------------------------------------------------------------------------
const cv = $("#cv");
const v2 = new PP.View2D(cv, () => draw());
const v3 = new PP.Orbit3D(cv, () => draw());
let fitted = false;
const using3D = () => is3D() && ui.view3d === "3d";
new ResizeObserver(() => draw()).observe($("#stage"));
function fit() {
  if (!pack) return;
  const c = pack.model.contour;
  if (is3D()) {
    if (ui.view3d === "3d") v3.fit([c.xmin, c.ymin, c.zmin ?? -30], [c.xmax, c.ymax, 0]);
    else { const r = planeRect(); v2.fit(r[0], r[1], r[2], r[3], 70); }
  } else v2.fit(c.xmin, c.ymin ?? -30, c.xmax, Math.max(c.ymax ?? 0, ...((pack.model.boreholes || []).map((b) => b.top ?? 0))), 70);
  if (!using3D() && v2.w > 900) {
    // Leave the right-hand side to the legend, so it never covers the model.
    const r = is3D() ? planeRect() : [c.xmin, c.ymin ?? -30, c.xmax, Math.max(c.ymax ?? 0, ...((pack.model.boreholes || []).map((b) => b.top ?? 0)))];
    const wm = Math.max(r[2] - r[0], 1e-6), hm = Math.max(r[3] - r[1], 1e-6), room = v2.w - 290;
    v2.s = Math.min(v2.s, (room - 100) / wm);
    v2.ox = 50 + (room - 100 - wm * v2.s) / 2 - r[0] * v2.s;
    v2.oy = (v2.h + hm * v2.s) / 2 + r[1] * v2.s;
  }
  fitted = true; draw();
}
function planeRect() { const c = pack.model.contour, z0 = c.zmin ?? -30; return ui.plane.axis === "x" ? [c.ymin, z0, c.ymax, 0] : ui.plane.axis === "y" ? [c.xmin, z0, c.xmax, 0] : [c.xmin, c.ymin, c.xmax, c.ymax]; }

function draw() {
  if (!pack) { v2.size(); v2.ctx.fillStyle = PP.css("--canvas"); v2.ctx.fillRect(0, 0, v2.w, v2.h); return; }
  if (using3D()) return draw3D();
  v2.size();
  const ctx = v2.ctx;
  ctx.fillStyle = PP.css("--canvas"); ctx.fillRect(0, 0, v2.w, v2.h);
  if (!fitted) { fit(); return; }
  const p = phase(), t = typeOf(ui.type);
  if (!usable(p)) { msg(ctx, p && p.skipped ? p.name + ": " + p.skipped : "No results for this phase."); return; }
  const plane = is3D();
  const nm = meshFor(p, plane ? "plane" : "node");
  const scale = ui.scale * ui.autoScale;
  const dx = (i) => 0, dy = (i) => 0;
  const nodeX = (i) => nm.xs[i], nodeY = (i) => nm.ys[i];
  // Geometry fill (soil under everything)
  const deformedOn = t.at === "mesh" || (ui.onDeformed && t.at === "node");
  const U = (k) => { const src = nm.idx ? nm.idx : null; const j = src ? src[k] : k; return j; };
  const ux = p.node.Ux, uy = plane ? (ui.plane.axis === "z" ? p.node.Uy : p.node.Uz) : p.node.Uy, uxp = plane ? (ui.plane.axis === "x" ? p.node.Uy : p.node.Ux) : ux;
  const PX = (k) => v2.X(nm.xs[k] + (deformedOn && uxp ? uxp[U(k)] * scale : 0)), PY = (k) => v2.Y(nm.ys[k] + (deformedOn && uy ? uy[U(k)] * scale : 0));
  // Base: material colours of the soil, lightly, under the result.
  drawSoilBase(ctx, p, nm, PX, PY, t);
  let legend = null;
  if (t.at === "node" || t.at === "sp") {
    const src = t.at === "sp" && !plane ? meshFor(p, "sp") : nm;
    const vals = values(p, t);
    const V = (k) => vals[src.idx ? src.idx[k] : k];
    const SX = src === nm ? PX : (k) => v2.X(src.xs[k]), SY = src === nm ? PY : (k) => v2.Y(src.ys[k]);
    let mn = Infinity, mx = -Infinity;
    for (let k = 0; k < src.xs.length; k++) { const v = V(k); if (v == null) continue; mn = Math.min(mn, v); mx = Math.max(mx, v); }
    const lv = PP.levels(mn, mx, 13), cols = PP.bandColours(lv.length - 1);
    if (ui.shading) shade(ctx, src, V, SX, SY, lv, cols);
    if (ui.contours) contour(ctx, src, V, SX, SY, lv);
    legend = { title: t.label, unit: t.unit, lv, cols, mn, mx };
    const e = extremes(src.idx ? src.idx.map((i) => vals[i]) : vals);
    legend.at = { mn: e.imn >= 0 ? [src.xs[e.imn], src.ys[e.imn]] : null, mx: e.imx >= 0 ? [src.xs[e.imx], src.ys[e.imx]] : null };
    if (t.key === "Utot" || t.key === "Ux" || t.key === "Uy" || t.key === "Uz") legend.big = e.mx >= -e.mn ? e.mx : e.mn;
    // Markers at the extremes, as Plaxis does
    for (const [k, lab] of [[e.imx, "max"], [e.imn, "min"]]) if (k >= 0) { const x = SX(src.idx ? src.idx.indexOf(k) : k), y = SY(src.idx ? src.idx.indexOf(k) : k); if (isFinite(x)) mark(ctx, src === nm ? PX(k) : v2.X(src.xs[k]), src === nm ? PY(k) : v2.Y(src.ys[k]), lab); }
  }
  if (t.at === "mesh" || ui.meshLines) meshLines(ctx, nm, PX, PY, t.at === "mesh");
  if (t.at === "mesh") {
    // The undeformed outline for comparison.
    outline(ctx, p, true);
    legend = { title: "Deformed mesh", note: "Scaled up " + fmt(scale, 3) + " times", big: maxDisp(p), unit: "m" };
  }
  if (ui.arrows && p.node.Ux) arrows(ctx, nm, PX, PY, uxp, uy, scale);
  if (t.at === "sp-plastic") { plastic(ctx, p); legend = { title: "Plastic points", note: "Mohr-Coulomb points (stress on the failure surface)", count: (p.sp.Plastic || []).filter((v) => v).length }; }
  if (t.at === "sp-dir") { principal(ctx, p); legend = { title: "Principal directions", note: "Lines along σ'1 (long) and σ'3, scaled to the stress" }; }
  outline(ctx, p, false);
  structures(ctx, p, t);
  if (t.at === "plate") legend = plateLegend(p, t) || legend;
  if (t.at === "anchor") legend = { title: "Anchor forces", unit: "kN", rows: (p.anchors || []).map((a) => [anchorName(a), a.F]) };
  if (ui.section) sectionLine(ctx);
  if (ui.curve) { const [x, y] = ui.curve.at; ctx.fillStyle = PP.css("--sel"); ctx.beginPath(); ctx.arc(v2.X(x), v2.Y(y), 6, 0, 7); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
  if (ui.tool === "section" && ui.sectionPts.length === 1 && ui.mouse) { ctx.strokeStyle = PP.css("--accent"); ctx.setLineDash([6, 4]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(v2.X(ui.sectionPts[0][0]), v2.Y(ui.sectionPts[0][1])); ctx.lineTo(v2.X(ui.mouse[0]), v2.Y(ui.mouse[1])); ctx.stroke(); ctx.setLineDash([]); }
  if (legend) drawLegend(ctx, legend);
  v2.upLabel = is3D() ? (ui.plane.axis === "z" ? "y" : "z") : "y";
  v2.axes(PP.css("--canvas-text"));
  hud();
}
function msg(ctx, text) { ctx.fillStyle = PP.css("--muted"); ctx.font = "14px Segoe UI"; ctx.textAlign = "center"; ctx.fillText(text, v2.w / 2, v2.h / 2); ctx.textAlign = "left"; }

function drawSoilBase(ctx, p, nm, PX, PY, t) {
  // Soil colours per layer (from the first borehole) under a light veil, so the result reads first.
  const hs = [...(pack.model.boreholes || [])].sort((a, b) => a.x - b.x), mats = pack.model.materials || [];
  const first = hs[0];
  const veil = PP.isDark() ? "#2b2f36" : "#ffffff";
  const strength = t.at === "mesh" || t.at === "sp-plastic" || t.at === "sp-dir" || t.at === "plate" || t.at === "anchor" || !ui.shading ? 0.55 : 0.0;
  if (!strength) return;
  for (let k = 0; k < nm.tri.length; k += 3) {
    const a = nm.tri[k], b = nm.tri[k + 1], c = nm.tri[k + 2];
    const cy = (nm.ys[a] + nm.ys[b] + nm.ys[c]) / 3, cx = (nm.xs[a] + nm.xs[b] + nm.xs[c]) / 3;
    let colour = "#d6d3c8";
    if (first && !is3D()) {
      let lvl = first.top ?? 0;
      for (const l of first.layers) { if (cy <= lvl && cy >= l.bottom - 1e-9) { const m = mats.find((q) => q.id === l.material); if (m) colour = m.colour; break; } lvl = l.bottom; }
    } else if (first) { const z = ui.plane.axis === "z" ? ui.plane.at : cy; let lvl = first.top ?? 0; for (const l of first.layers) { if (z <= lvl && z >= l.bottom) { const m = mats.find((q) => q.id === l.material); if (m) colour = m.colour; break; } lvl = l.bottom; } }
    ctx.fillStyle = PP.mix(colour, veil, strength);
    ctx.beginPath(); ctx.moveTo(PX(a), PY(a)); ctx.lineTo(PX(b), PY(b)); ctx.lineTo(PX(c), PY(c)); ctx.closePath(); ctx.fill(); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.6; ctx.stroke();
  }
}

    ["View", [{ label: "Zoom to model", key: "F", run: fit }, "-", { label: "Shadings", check: () => ui.shading, run: () => { ui.shading = !ui.shading; renderAll(); } }, { label: "Contour lines", check: () => ui.contours, run: () => { ui.contours = !ui.contours; renderAll(); } },
      { label: "Arrows", check: () => ui.arrows, run: () => { ui.arrows = !ui.arrows; renderAll(); } }, { label: "Mesh lines", check: () => ui.meshLines, run: () => { ui.meshLines = !ui.meshLines; renderAll(); } }, "-",
      { head: "Theme" }, ...["auto", "light", "dark"].map((t) => ({ label: { auto: "Same as Windows", light: "Light", dark: "Dark" }[t], run: () => { PP.theme(t); renderAll(); } }))]],
    ...["Deformations", "Stresses", "Pore pressures", "Structures"].map((g) => [g, () => TYPES.filter((t) => t.group === g && !(t.d2 && is3D()) && !(t.d3 && !is3D())).map((t) => ({ label: t.label, check: () => ui.type === t.key, enabled: () => !!pack && available(phase(), t), run: () => setType(t.key) }))]),
    ["Tools", [{ label: "Cross section", run: () => { ui.tool = "section"; ui.sectionPts = []; $("#hint").textContent = "Click the start (A) and the end (A*) of the cross section."; }, enabled: () => !!pack && !using3D() }, { label: "Curve at a point", run: () => { ui.tool = "curve"; $("#hint").textContent = "Click a point."; }, enabled: () => !!pack && !using3D() }, { label: "Tables", run: tables, enabled: () => !!pack }]],
    ["Help", [{ label: "About the Viewer", run: () => PP.dialog({ title: "Plaxis ProMax Viewer", size: "sm", body: el("div", el("p", "Shows the results of a Plaxis calculation with no Plaxis and no licence. Every value was copied from Plaxis Output when Plaxis ProMax calculated the model."), el("p", "Shadings and lines are drawn over a display mesh made from Plaxis's nodes and stress points; Plaxis's own element edges are not in the file."), el("p", "Mouse: wheel to zoom, right or middle drag to pan (3D: left drag rotates).")) }) }]],
  ]);
}

// ---- Start ---------------------------------------------------------------------------------------------------------
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,select,textarea")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") { e.preventDefault(); openFile(); }
  else if (e.key === "f" && pack) fit();
  else if (e.key === "PageDown" && pack) setPhase(ui.phase + 1);
  else if (e.key === "PageUp" && pack) setPhase(ui.phase - 1);
  else if (e.key === "Escape") { ui.tool = null; ui.sectionPts = []; $("#hint").textContent = ""; draw(); }
});
const stage = $("#stage");
stage.addEventListener("dragover", (e) => { e.preventDefault(); });
stage.addEventListener("drop", async (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadBuffer(await f.arrayBuffer(), f.name); });
async function start() {
  PP.theme(); $("#logo").append(icon("logo"));
  renderAll();
  const embedded = document.getElementById("ppr-data");
  const q = new URLSearchParams(location.search);
  if (window.PPR_START) { await loadBuffer(window.PPR_START, window.PPR_START_NAME); if (window.PPR_START_UI) { Object.assign(ui, window.PPR_START_UI); fitted = false; ui.autoScale = autoScale(phase()); renderAll(); if (window.PPR_START_UI.section) showSection(); if (window.PPR_START_UI.curve) showCurve(); } return; }
  if (embedded) { const b = Uint8Array.from(atob(embedded.textContent.trim()), (c) => c.charCodeAt(0)); await loadBuffer(b.buffer, ""); return; }
  if (q.get("pack")) { try { const r = await fetch(q.get("pack")); await loadBuffer(await r.arrayBuffer(), q.get("name") || ""); return; } catch (e) { PP.toast("Could not read the results: " + e.message); } }
  stage.append(el("div.drop#drop", el("div.card", icon("viewer"), el("h2", "Open Plaxis results"), el("p", "Drop a results file (.ppr) here, or pick one. Calculate in Plaxis writes it beside the model. No Plaxis or licence is needed to look at it."),
    el("button.btn.primary", { onclick: openFile }, icon("open"), "Open results…"))));
}
const _load = loadBuffer;
loadBuffer = async (b, n) => { await _load(b, n); if (pack) { ui.autoScale = autoScale(phase()); renderAll(); } };
start();
</script>
