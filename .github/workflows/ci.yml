# Builds the Windows app and runs every check on each push and pull request: the worker's tests and the C# checks run
# against a stand-in Plaxis (tests/fake_plaxis), so no Plaxis licence is needed. The built app is kept as an artifact.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Worker tests (stand-in Plaxis)
        run: python -m unittest discover -s tests/worker -v
      - name: Checks (approvals, kept code, MCP, Plaxis link, chat engine)
        run: dotnet run --project tests/PlaxisProMax.Tests -c Release
      - name: Build the app
        shell: pwsh
        run: .\build.ps1
      - name: Screenshots of the windows (sample content, no Plaxis or Claude)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\app\PlaxisProMax.exe -ArgumentList '--screenshots', "$pwd\screenshots" -Wait -PassThru
          Get-ChildItem screenshots
          if ($p.ExitCode -ne 0 -or (Get-ChildItem screenshots\*.png).Count -lt 17) { throw "Screenshots failed ($($p.ExitCode))." }
      - uses: actions/upload-artifact@v4
        with:
          name: PlaxisProMax-screenshots
          path: screenshots
      - name: Keep the screenshots on the screenshots branch (readable with git, newest build per branch)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $branch = "screenshots/${{ github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item screenshots\*.png $dir
          Set-Location $dir
          git init -q -b $branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"
      - name: Package
        shell: pwsh
        run: |
          $pkg = "package\PlaxisProMax"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist $pkg -Recurse
          Copy-Item install.ps1, Install.cmd, README.md $pkg
      - uses: actions/upload-artifact@v4
        with:
          name: PlaxisProMax-build
          path: package
